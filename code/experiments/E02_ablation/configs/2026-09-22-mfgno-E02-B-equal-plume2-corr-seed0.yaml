epochs: 2000
# loss args
if_physical_loss: 1
if_v_gradient_loss: 0
if_continuity_loss: 0
if_argument_v_loss: 0
if_continuity_loss_non_uniform: 0
if_l2re_loss: 0
if_weighted_l2re_loss: 0
loss_mode: "equal"
# datasets args — 方案 B 保守重映射数据
dataset:
  single_file: True
  file_name: "plume2d_train_ds_128x128_phys1e6_first21_corrected.hdf5"
  saved_folder: "/fs1/home/USER/lhl/neuraloeprator-main/data/plume2/"
  reduced_resolution: 1
  reduced_resolution_t: 1
  reduced_batch: 1
  test_ratio: 0.1
# dataloader args
dataloader:
  batch_size: 2
  num_workers: 4
  pin_memory: True
# model args — large: hidden=512, layers=6
model:
  hidden_features: 512
  hidden_layer: 6
  zero_var_diff: true
# optimizer args
