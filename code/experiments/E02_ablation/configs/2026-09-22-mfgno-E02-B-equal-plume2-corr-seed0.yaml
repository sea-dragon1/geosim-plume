# MFGNO large — originA (conservative remapping 128×128)
root_path: "/fs1/home/USER/lhl/neuraloeprator-main/Plume_data/iclr2027/geosim-plume/code/experiments/E02_ablation/runs"
model_id: "MFGNO"
exp_id: "2026-09-22-mfgno-E02-B-equal-plume2-corr-seed0"
# PDE Information
pde_name: "2D_Mantle_Convection"
temporal_domain: (0, 12.9913)
resolution_t: 21
spatial_domain: "[(0, 1), (0, 1)]"
resolution: [128, 128]
variables: {"m": 0.1, "eta": 0.1, "zeta": 0.1}
num_outputs: 6
# training args
if_training: True
continue_training: False
model_path: null
save_period: 20
tensorboard: False
log_dir: "./logs/tensorboard/"
seed: 0
time_window: 10
neighbors: 1
unrolling: 0
